name: Tests
"on":
  pull_request: {}
  push:
    branches:
    - main
jobs:
  unit:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE_WITH: development
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Run Tests
      run: bundle exec rake
    - uses: codecov/codecov-action@v7
      with:
        use_oidc: true
